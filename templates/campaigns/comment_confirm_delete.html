{% extends 'base.html' %}
{% block title %}Delete Comment - BackerWave{% endblock %}

{% block content %}
<div class="bg-surface border-bottom border-subtle pt-4 pb-5 min-vh-100">
    <div class="container max-w-700">
        <div class="card border-0 shadow-sm rounded-4 overflow-hidden mb-4 bg-light">
            <div class="card-body p-4 text-center">
                <div class="bg-danger-subtle text-danger rounded-circle d-inline-flex align-items-center justify-content-center mb-4" style="width: 80px; height: 80px;">
                    <i class="bi bi-trash" style="font-size: 2.5rem;"></i>
                </div>
                <h4 class="fw-bold mb-3">Delete Comment</h4>
                <p class="text-muted mb-4">Are you sure you want to delete this comment? This action cannot be undone.</p>
                <div class="bg-white border border-subtle rounded-3 p-3 mb-4 text-start text-secondary shadow-sm">
                    "{{ comment.content }}"
                </div>
                
                <form method="post" action="{% url 'campaigns:comment_delete' comment.id %}">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-2">
                        <a href="{% url 'campaigns:detail' campaign.slug %}" class="btn btn-outline-secondary rounded-pill px-4 fw-medium">Cancel</a>
                        <button type="submit" class="btn btn-danger rounded-pill px-4 fw-medium">Delete Comment</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
